<!DOCTYPE html>
<html>

<head>
    <title>Consultar Saldo</title>
</head>

<body>

    <h1>Consultar Saldo</h1>

    <form method="POST">

        <input
            type="number"
            name="numero"
            placeholder="Número da conta"
        >

        <div style="text-align: center;">
            <button type="submit">Consultar</button>
        </div>

    </form>

    {% if conta %}

        <h2>Conta encontrada</h2>

        <p>
            Número da conta:
            {{ conta["numero"] }}
        </p>

        <p>
            Cliente:
            {{ conta["cliente"]["nome"] }}
        </p>

        <p>
            Saldo:
            R$ {{ conta["saldo"] }}
        </p>

    {% endif %}

    <br>

    <div style="text-align: center;">
        <a href="/">Voltar para a página inicial</a>
    </div>

</body>

</html>
