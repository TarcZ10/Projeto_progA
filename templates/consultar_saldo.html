<!DOCTYPE html>
<html>

<head>
    <title>Consultar Saldo</title>
</head>

<body>

    <h1>Consultar Saldo</h1>

    <form method="POST">

        <input
            type="number"
            name="numero"
            placeholder="Número da conta"
        >

        <button type="submit">
            Consultar
        </button>


    </form>

    {% if conta %}

        <h2>Conta encontrada</h2>

        <p>
            Número da conta:
            {{ conta["numero"] }}
        </p>

        <p>
            Cliente:
            {{ conta["cliente"]["nome"] }}
        </p>

        <p>
            Saldo:
            R$ {{ conta["saldo"] }}
        </p>

    {% endif %}

    <br>

    <a href="/">
        Voltar para a página inicial
    </a>


</body>

</html>
