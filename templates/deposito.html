<!DOCTYPE html>
<html>

<head>
    <title>Depositar</title>
</head>

<body>

    <h1>Depositar</h1>

    <form method="POST">

        <input
            type="number"
            name="numero"
            placeholder="Número da conta"
        >

        <br><br>

        <input
            type="number"
            step="0.01"
            name="valor"
            placeholder="Valor do depósito"
        >

        <br><br>
        
        <button type="submit">
            Depositar
        </button>

    </form>

    {% if sucesso == True %}

        <h2>Depósito realizado!</h2>

        <p>
            Conta:
            {{ conta["numero"] }}
        </p>

        <p>
            Cliente:
            {{ conta["cliente"]["nome"] }}
        </p>

        <p>
            Saldo atual:
            R$ {{ conta["saldo"] }}
        </p>

    {% elif sucesso == False %}

        <p>Valor de depósito inválido.</p>

    {% endif %}

    <br>

    <a href="/">
        Voltar para a página inicial
    </a>

</body>

</html>
